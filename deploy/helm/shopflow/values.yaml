# Default values for shopflow chart.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

replicaCount: 2

image:
  repository: shopflow
  pullPolicy: IfNotPresent
  tag: "latest"

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  automount: false
  annotations: {}
  name: ""

podSecurityContext:
  fsGroup: 10001
  runAsNonRoot: true
  runAsUser: 10001

securityContext:
  runAsNonRoot: true
  runAsUser: 10001
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

service:
  type: ClusterIP
  port: 8080
  targetPort: 8080

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: shopflow.local
      paths:
        - path: /
          pathType: Prefix
  tls: []

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 80
  targetMemoryUtilizationPercentage: 80

podDisruptionBudget:
  enabled: true
  minAvailable: 1

probes:
  livenessProbe:
    httpGet:
      path: /health/live
      port: 8080
    initialDelaySeconds: 10
    periodSeconds: 10
    timeoutSeconds: 3
    failureThreshold: 3
  readinessProbe:
    httpGet:
      path: /health/ready
      port: 8080
    initialDelaySeconds: 5
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 2

# Non-sensitive configuration variables injected into ConfigMap
config:
  HTTP_PORT: "8080"
  PORT: "8080"
  LOG_LEVEL: "INFO"
  DB_HOST: "postgres-postgresql.default.svc.cluster.local"
  DB_PORT: "5432"
  DB_NAME: "shopflow"
  DB_USER: "shopflow"
  DB_SSLMODE: "disable"
  KAFKA_BROKERS: "kafka.default.svc.cluster.local:9092"
  REDIS_ADDR: "redis-master.default.svc.cluster.local:6379"
  REDIS_DB: "0"
  STORAGE_PROVIDER: "minio"
  S3_ENDPOINT: "minio.default.svc.cluster.local:9000"
  S3_BUCKET: "shopflow-media"
  S3_REGION: "us-east-1"
  S3_USE_SSL: "false"
  SEARCH_PROVIDER: "opensearch"
  OPENSEARCH_URL: "http://opensearch.default.svc.cluster.local:9200"
  OPENSEARCH_INDEX: "shopflow_products"
  EMAIL_PROVIDER: "smtp"
  SMTP_HOST: "mailpit.default.svc.cluster.local"
  SMTP_PORT: "1025"
  EMAIL_FROM: "no-reply@shopflow.io"
  WEB_DIST_PATH: "/app/web/dist"

# Sensitive credentials and secrets injected into Kubernetes Secret
secrets:
  DATABASE_URL: "postgres://shopflow:shopflow_secret@postgres-postgresql.default.svc.cluster.local:5432/shopflow?sslmode=disable"
  DB_PASSWORD: "shopflow_secret"
  REDIS_PASSWORD: ""
  S3_ACCESS_KEY: "minioadmin"
  S3_SECRET_KEY: "minioadmin_secret"
  S3_SECRET_ACCESS_KEY: "minioadmin_secret"
  OPENSEARCH_USERNAME: ""
  OPENSEARCH_PASSWORD: ""
  SMTP_USERNAME: ""
  SMTP_PASSWORD: ""

nodeSelector: {}

tolerations: []

affinity: {}
